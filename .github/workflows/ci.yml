name: CI

# 主线验证（push main）：JVM 构建矩阵 + C++ 原生层（host 编译测试 + Android NDK 交叉编译）。
# PR 的门禁检查见 pr-check.yml（同一套 job + PR 元数据校验 + 聚合门禁）。
on:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 17, 21 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: '**/build/reports/tests/'
          retention-days: 7

  native-host:
    name: Native Host (C++17 + JNI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # host 构建需要 JDK 的 jni.h（CMake find_package(JNI)）
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure (CMake)
        run: cmake -S agent-shell-native/src/main/cpp -B build-native -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-native --parallel

      - name: C++ unit tests
        run: ctest --test-dir build-native --output-on-failure

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # JVM 集成测试：加载 host 构建的 libagsh_native.so
      #（strict=true —— 库加载失败直接红，防止"静默全跳过"假绿）
      - name: JVM integration tests (native strict)
        run: >-
          ./gradlew :agent-shell-native:test
          -Pagsh.native.lib=$PWD/build-native/libagsh_native.so
          -Pagsh.native.strict=true
          --stacktrace

      - name: Upload native library (host)
        uses: actions/upload-artifact@v4
        with:
          name: libagsh_native-linux-x64
          path: build-native/libagsh_native.so
          retention-days: 14

  native-android:
    name: Native Android (NDK arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cross-compile (NDK arm64-v8a)
        run: |
          NDK_DIR="${ANDROID_NDK_HOME:-}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            NDK_DIR=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "::error::未找到 Android NDK（预期 runner 预装或设置 ANDROID_NDK_HOME）"
            exit 1
          fi
          echo "Using NDK: $NDK_DIR"
          cmake -S agent-shell-native/src/main/cpp -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_STL=c++_static \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-android --parallel

      - name: Verify artifact (ELF64 / AArch64 / JNI symbols)
        run: |
          SO=build-android/libagsh_native.so
          ls -la "$SO"
          file "$SO"
          # 产物必须是 AArch64 的 ELF64 动态库
          readelf -h "$SO" | tee /dev/stderr | grep -q 'Class:.*ELF64'
          readelf -h "$SO" | tee /dev/stderr | grep -q 'Machine:.*AArch64'
          readelf -h "$SO" | tee /dev/stderr | grep -q 'Type:.*DYN'
          # JNI 符号必须全部导出（15 个 NativeBridge 入口 + JNI_OnLoad）
          EXPORTED=$(nm -D --defined-only "$SO" | grep -c 'Java_com_androidguru_agent_shell_nativeruntime_NativeBridge_')
          echo "exported JNI symbols: $EXPORTED"
          [ "$EXPORTED" -ge 15 ]

      - name: Upload native library (android arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: libagsh_native-android-arm64-v8a
          path: build-android/libagsh_native.so
          retention-days: 14
